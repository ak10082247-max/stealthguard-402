runtime: container
build:
  dockerfile: Dockerfile
  dockerBuildPath: .
startCommand:
  type: stdio
  command: npx
  args:
    - -y
    - stealthguard-mcp
  configSchema:
    type: object
    properties:
      STEALTHGUARD_URL:
        type: string
        description: Custom StealthGuard HTTP MCP endpoint URL (defaults to live production service)
        default: https://stealthguard-402.onrender.com/mcp
    additionalProperties: false
  exampleConfig:
    STEALTHGUARD_URL: https://stealthguard-402.onrender.com/mcp
