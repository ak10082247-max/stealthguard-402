services:
  - type: web
    name: stealthguard-402
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    disk:
      name: stealth-payment-state
      mountPath: /app/state
      sizeGB: 1
    envVars:
      - key: X402_STATE_DB
        value: /app/state/x402.sqlite3
      - key: SOLANA_MERCHANT_ADDRESS
        value: 9wuMysgXwNhtQeqJgGByAiMYc4EjzZ5wUSmnjrrt3ffh
      - key: WALLET_ADDRESS
        value: 0x80E0Ae84679b7f11bE171DaADd492FBECf628cd6
      - key: PUBLIC_URL
        value: https://stealthguard-402.onrender.com
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
