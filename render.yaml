services:
  - type: web
    name: stealthguard-402
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: WALLET_ADDRESS
        value: 0x80E0Ae84679b7f11bE171DaADd492FBECf628cd6
      - key: PUBLIC_URL
        value: https://stealthguard-402.onrender.com
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
